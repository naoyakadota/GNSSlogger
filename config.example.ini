[device]
name = EXAMPLE1

[ftp]
host = ftp.example.invalid
port = 21
user = gps-logger
password = replace-locally-never-commit
# setup.sh generates this complete path from the FTP parent directory and
# [device] name.
remote_dir = /YourTopDirectory/YourOptionalSecondDirectory/EXAMPLE1

[serial]
port = auto
baud = auto
auto_baud_candidates = 115200,9600,38400,57600,230400,460800
auto_probe_sec = 3.0
read_timeout_sec = 1.0
startup_commands_file = /etc/gps-logger/startup_commands.txt
startup_command_delay_sec = 0.2
startup_command_terminator = CRLF

[reset]
enabled = true
gpio_bcm = 17
after_no_valid_nmea_sec = 300
pulse_sec = 0.2
reconnect_wait_sec = 5

[upload]
daily_at = 00:10
retry_interval_minutes = 60

[storage]
log_dir = /home/pi/GPS_data/EXAMPLE1
